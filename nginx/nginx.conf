# Nginx Reverse Proxy Configuration for FastAPI AQI Service
# Reverse Proxy HTTPS (Port 8443) -> FastAPI Backend (http://127.0.0.1:8000)

error_log  "C:/Users/indrajit/Desktop/project-final/logs/error.log";
pid        "C:/Users/indrajit/Desktop/project-final/logs/nginx.pid";

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log    "C:/Users/indrajit/Desktop/project-final/logs/access.log";
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream FastAPI Uvicorn Server
    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }

    # HTTP Server - Redirects HTTP to HTTPS
    server {
        listen       8080;
        server_name  localhost 127.0.0.1;

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # HTTPS Reverse Proxy Server
    server {
        listen       8443 ssl;
        server_name  localhost 127.0.0.1;

        # SSL Certificate Paths
        ssl_certificate      "C:/Users/indrajit/Desktop/project-final/cert.pem";
        ssl_certificate_key  "C:/Users/indrajit/Desktop/project-final/key.pem";

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Proxy all traffic to FastAPI backend
        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }
    }
}
